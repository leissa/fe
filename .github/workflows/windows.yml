name: windows

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: msvc ${{matrix.build-type}}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure

      - name: Install
        run: cmake --install ${{github.workspace}}/build --prefix ${{github.workspace}}/prefix

      - name: Configure the consumer
        run: cmake -S ${{github.workspace}}/tests/consumer -B ${{github.workspace}}/build-consumer -G Ninja -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DCMAKE_PREFIX_PATH=${{github.workspace}}/prefix

      - name: Build and run the consumer
        run: |
          cmake --build ${{github.workspace}}/build-consumer -v
          ${{github.workspace}}/build-consumer/fe-consumer.exe
