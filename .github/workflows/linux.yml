name: linux

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: gcc-15 ${{matrix.build-type}}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind g++-15

      - name: Configure
        run: CC=gcc-15 CXX=g++-15 cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Install
        run: cmake --install ${{github.workspace}}/build --prefix ${{github.workspace}}/prefix

      - name: Consume the installed package
        run: |
          CC=gcc-15 CXX=g++-15 cmake -S ${{github.workspace}}/tests/consumer -B ${{github.workspace}}/build-consumer -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DCMAKE_PREFIX_PATH=${{github.workspace}}/prefix
          cmake --build ${{github.workspace}}/build-consumer -v
          ${{github.workspace}}/build-consumer/fe-consumer

      - name: Test with Valgrind
        run: valgrind --error-exitcode=1 --leak-check=full ${{github.workspace}}/build/bin/fe-test

  sanitize:
    name: ASan+LSan+UBSan
    runs-on: ubuntu-26.04

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++-15

      - name: Configure
        run: >
          CC=clang CXX=clang++ cmake -S ${{github.workspace}} -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,leak,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,leak,undefined"

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
